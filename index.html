function App() {
  const [activeTab, setActiveTab] = useState('news');
  const [currentDateString, setCurrentDateString] = useState(getTodayString());

  const [userBeans, setUserBeans] = useState(() => {

  });

  // 퀴즈 관련 상태
  const [quizType, setQuizType] = useState('daily');
  const [currentQuizIndex, setCurrentQuizIndex] = useState(0);
  const [selectedAnswer, setSelectedAnswer] = useState(null);
  const [isAnswerSubmitted, setIsAnswerSubmitted] = useState(false);
  const [quizScore, setQuizScore] = useState({ correct: 0, total: 0 });
  const [quizLogs, setQuizLogs] = useState({});

  // 예측 및 상점
  const [marketPreds, setMarketPreds] = useState(INITIAL_PREDICTIONS);
  const [userVotes, setUserVotes] = useState({});
  const [showVoteSuccess, setShowVoteSuccess] = useState(false);
  const [purchaseHistory, setPurchaseHistory] = useState([]);
  const [storeModalMsg, setStoreModalMsg] = useState("");

  // Gemini API 연동 관련
  const [apiKey, setApiKey] = useState("");
  const [showApiKeyModal, setShowApiKeyModal] = useState(false);
  const [aiPrompt, setAiPrompt] = useState("");
  const [aiLoading, setAiLoading] = useState(false);
  const [aiError, setAiError] = useState("");
  const [toastMsg, setToastMsg] = useState("");

  // 초기 로드 시 당일 뉴스 구성
  useEffect(() => {
    brewDailyFreshNews(true);
  }, []);

  // 원두 포인트 변경 시 로컬 스토리지에 동기화
  useEffect(() => {
    safeStorage.set(STORAGE_KEY_BEANS, userBeans.toString());
  }, [userBeans]);

  const triggerToast = (msg) => {
    setToastMsg(msg);
    setTimeout(() => setToastMsg(""), 3000);
  };

  // 실시간 무작위 기사 브루잉 시스템
  const brewDailyFreshNews = (isInitial = false) => {
    setIsBrewing(true);
    setTimeout(() => {
      if (!isInitial) {
        const now = new Date();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        setCurrentDateString(`${getTodayString()} (실시간 브루잉 ${minutes}:${seconds})`);
      } else {
        setCurrentDateString(getTodayString());
      }

      // 무작위로 기사 선별
      const shuffled = [...DAILY_NEWS_POOL].sort(() => 0.5 - Math.random());
      const selectedNews = shuffled.slice(0, 3).map((item, index) => ({
        ...item,
        id: Date.now() + index,
      }));

      setNewsList(selectedNews);
      setReadNews({});
      setCurrentQuizIndex(0);
      setSelectedAnswer(null);
      setIsAnswerSubmitted(false);
      setIsBrewing(false);

      if (!isInitial) {
        triggerToast("☕ 오늘자 새로운 분석 기사 3개가 신선하게 요약·로스팅되었습니다!");
      }
    }, 700);
  };

  // 기사 독해 완료 시 포인트 수확
  const handleReadConfirm = (newsId) => {
    if (!readNews[newsId]) {
      setReadNews({ ...readNews, [newsId]: true });
      setUserBeans(prev => prev + 10);
      triggerToast("☕ 정독 인증 성공! 분석용 원두 +10개 수확 완료!");
    }
  };

  // 퀴즈 탭 연동
  const currentQuizList = quizType === 'daily' ? newsList : COMMON_SENSE_QUIZZES;
  const currentItem = currentQuizList[currentQuizIndex];
  const currentQuiz = currentItem ? (quizType === 'daily' ? currentItem.quiz : currentItem) : null;
  const isCurrentQuizAlreadyAnswered = currentItem ? quizLogs[currentItem.id] !== undefined : false;

  const goToQuizFromNews = (newsId) => {
    const idx = newsList.findIndex(n => n.id === newsId);
    if (idx !== -1) {
      setActiveTab('quiz');
      setQuizType('daily');
      setCurrentQuizIndex(idx);
      setSelectedAnswer(null);
      setIsAnswerSubmitted(false);
    }
  };

  // 퀴즈 정답 제출 처리
  const handleSubmitQuizAnswer = (quiz, chosenIdx) => {
    if (isAnswerSubmitted || isCurrentQuizAlreadyAnswered) return;

    setSelectedAnswer(chosenIdx);
    setIsAnswerSubmitted(true);

    const isCorrect = chosenIdx === quiz.correctAnswer;

    setQuizLogs(prev => ({
      ...prev,
      [currentItem.id]: {
        chosen: chosenIdx,
        correct: quiz.correctAnswer,
        isCorrect
      }
    }));

    if (isCorrect) {
      setUserBeans(prev => prev + 25);
      setQuizScore(prev => ({ ...prev, correct: prev.correct + 1, total: prev.total + 1 }));
      triggerToast("🎯 대박! 정답을 맞혀 기분 좋은 보너스 원두 +25개 획득!");
    } else {
      setQuizScore(prev => ({ ...prev, total: prev.total + 1 }));
      if (userShields > 0) {
        setUserShields(prev => prev - 1);
        triggerToast("🛡️ 아쉽게 정답 비껴감! 하지만 '오답 방패' 차단 효과로 원두 손실을 완전 방어했습니다.");
      } else {
        triggerToast("❌ 오답입니다. 하단의 브리핑 해설을 꼼꼼하게 읽어 거시 상식으로 만들어 보세요!");
      }
    }
  };

  // 퀴즈 보기별 동적 버튼 스타일 바인딩
  const getOptionClass = (quiz, idx) => {
    if (!currentItem) return '';
    const log = quizLogs[currentItem.id];

    if (isAnswerSubmitted) {
      const isThisSelected = selectedAnswer === idx;
      const isThisCorrect = quiz.correctAnswer === idx;

      if (isThisCorrect) return 'bg-emerald-950/70 border-emerald-500 text-emerald-400 font-bold';
      if (isThisSelected) return 'bg-rose-950/70 border-rose-500 text-rose-400 font-bold';
      return 'bg-slate-800/20 border-slate-800 text-slate-600 cursor-default';
    }

    if (log) {
      const isThisCorrect = quiz.correctAnswer === idx;
      const wasChosen = log.chosen === idx;
      if (isThisCorrect) return 'bg-emerald-950/70 border-emerald-500 text-emerald-400 font-bold';
      if (wasChosen) return 'bg-rose-950/70 border-rose-500 text-rose-400';
      return 'bg-slate-800/20 border-slate-800 text-slate-600 cursor-default';
    }

    return 'bg-slate-800/60 border-slate-700 text-slate-300 hover:bg-slate-700/60 hover:border-slate-500';
  };

  const handleNextQuiz = () => {
    setSelectedAnswer(null);
    setIsAnswerSubmitted(false);
    if (currentQuizIndex < currentQuizList.length - 1) {
      setCurrentQuizIndex(currentQuizIndex + 1);
    } else {
      setCurrentQuizIndex(0);
      triggerToast("🔄 처음 퀴즈 학습 구역으로 한 바퀴 순환되었습니다!");
    }
  };

  // 모의 시장 트렌드 예측 참여
  const handleMarketVote = (id, direction) => {
    if (userVotes[id]) {
      triggerToast("오늘의 트렌드 예측 분석 실습은 이미 완료되었습니다.");
      return;
    }
    setUserVotes({ ...userVotes, [id]: direction });
    setUserBeans(prev => prev + 15);
    setShowVoteSuccess(true);
    setTimeout(() => setShowVoteSuccess(false), 2000);
    triggerToast("📈 모의 시세 흐름 연구 성공! 학습 격려 원두 +15개 획득!");
  };

  const handleBuyItem = (item) => {
    if (userBeans < item.price) {
      setStoreModalMsg("수집한 원두가 다소 부족합니다! ☕ 기사를 성실히 탐구하고 퀴즈를 풀어 원두를 더 불려오세요.");
      return;
    }
    setUserBeans(prev => prev - item.price);

    if (item.id === 'shield') {
      setUserShields(prev => prev + 1);
      setStoreModalMsg("🛡️ 학습 보호 아이템 '오답 방패'를 장착했습니다!\n오답 감지 시 1회 자동으로 소비되며 포인트를 방어해 줍니다.");
    } else {
      const randomCouponCode = `REWARD-${Math.floor(100000 + Math.random() * 900000)}`;
      setPurchaseHistory(prev => [...prev, { ...item, code: randomCouponCode, date: new Date().toLocaleDateString() }]);
      setStoreModalMsg(`🎁 실물 모바일 교환 상품이 안전하게 발행되었습니다!\n보관함을 확인하세요.\n[발급핀코드: ${randomCouponCode}]`);
    }
  };

  // --- Gemini API 실시간 학습지 생성 ---
  const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

  // API 키가 없거나 호출에 실패했을 때 쓰는 체험용 시뮬레이션 기사
  const buildSimulatedNews = (topic) => ({
    id: Date.now(),
    tag: `AI 브루: ${topic}`,
    title: `[AI 전망분석] 글로벌 시장을 뒤흔드는 '${topic}' 신규 시너지 집중 진단`,
    summary: `최근 거시 지표 변화 속에서 '${topic}'에 관한 산업 지표 동향이 매우 가파르게 상향 평준화되는 양상입니다. 미래 신성장 산업에 있어 주요 핵심 기술로 주목받고 있습니다.`,
    details: `친환경 규제 및 글로벌 정책 기류와 맞물려 '${topic}' 핵심 가치 사슬 전반에 인프라 확장이 진행되고 있습니다. 다만 기술적 안정성과 독과점 우려가 일부 상존하므로, 지속적인 기술 모니터링 및 심층 연구가 유효할 것으로 평가받습니다.`,
    keywords: [topic, "성장 자원", "안정성 연구", "기술 모니터링"],
    quiz: {
      question: `'${topic}' 산업 구조를 다룬 기사 내용 중 올바른 설명은 무엇인가요?`,
      options: [
        "해당 분야 기술 성장이 완전히 종결되었으므로 학술적 연구 가치가 없다.",
        "정책적 인프라 확장이 이뤄지고 있으나 안정성 연구와 지속적인 모니터링이 병행되어야 한다.",
        "미래 산업과는 전혀 무관한 구시대적 기술로 판명되었다.",
        "실물 경제와 동떨어져 있어 어떠한 지표 상승도 발생하지 않는다."
      ],
      correctAnswer: 1, // 2번 선택지 정답
      explanation: `기술 혁신 주기에는 인프라 성장과 더불어 안정성 검증이라는 과제가 동반되므로, 지속적인 모니터링과 다각적 연구가 필요하다는 것이 핵심입니다.`
    }
  });

  const generateAICustomBrew = async () => {
    const topic = aiPrompt.trim();
    if (!topic) {
      setAiError("추출하고 싶은 흥미로운 금융 단어 혹은 기업명을 적어주세요!");
      return;
    }
    setAiLoading(true);
    setAiError("");

    // API Key 미설정 시: 체험용 시뮬레이션 동작
    if (!apiKey.trim()) {
      await sleep(1300);
      setNewsList(prev => [buildSimulatedNews(topic), ...prev]);
      setActiveTab('news');
      setAiPrompt("");
      setAiLoading(false);
      triggerToast(`✨ '${topic}' 관련 AI 요약 기사 및 전용 상식 시험지가 갓 구워져 배달되었습니다!`);

    }

    const systemPrompt = "너는 경제 분석 전문가이자 청소년을 위한 최고의 경제 상식 출제 위원이야. 사용자가 경제 용어, 기업, 시사 등 키워드를 제공하면 그 키워드를 건전하고 유익하게 심층 분석한 당일 뉴스 정보와, 이에 기반한 검증된 4지선다형 퀴즈 1개를 완성도 높은 JSON 양식으로 답변해야 해. 출력 포맷은 반드시 아래 JSON 규칙을 엄격히 준수해줘. 절대 도박, 사행성 단어를 쓰지 마.\n\nJSON Output Format:\n{\n  \"tag\": \"분류 태그\",\n  \"title\": \"기사 헤드라인 제목\",\n  \"summary\": \"3줄 이내의 명확한 핵심 뉴스 요약 내용\",\n  \"details\": \"배경 지식을 상세하게 분석한 5줄 내외의 추가 설명 본문\",\n  \"keywords\": [\"키워드1\", \"키워드2\"],\n  \"quiz\": {\n    \"question\": \"본문 내용에 근거한 4지선다형 질문\",\n    \"options\": [\"보기1\", \"보기2\", \"보기3\", \"보기4\"],\n    \"correctAnswer\": 0, \n    \"explanation\": \"친절하고 쉬운 정답 해설\"\n  }\n}\n*주의: correctAnswer는 0, 1, 2, 3 중 정답 인덱스 숫자여야 함.";

    const MAX_RETRIES = 3;
    let delay = 1000;
    let lastError = null;

    for (let attempt = 0; attempt <= MAX_RETRIES; attempt++) {
      try {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey.trim() },
            body: JSON.stringify({
              contents: [{ parts: [{ text: `사용자 키워드: ${topic}` }] }],
              systemInstruction: { parts: [{ text: systemPrompt }] },
              generationConfig: { responseMimeType: "application/json" }
            })
          }
        );

        if (!response.ok) {
          const errBody = await response.json().catch(() => ({}));
          const err = new Error(errBody?.error?.message || `HTTP ${response.status}`);
          err.status = response.status;
          throw err;
        }

        const data = await response.json();
        const jsonText = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!jsonText) throw new Error("AI 응답이 비어 있습니다.");
        const parsed = JSON.parse(jsonText.replace(/^\s*```(?:json)?\s*|\s*```\s*$/g, ''));

        const q = parsed.quiz;

          id: Date.now(),
          tag: parsed.tag || "AI 브루잉",
          title: parsed.title || `${topic} 관련 이슈 분석`,
          summary: parsed.summary || "분석 정보를 축적하지 못했습니다.",
          details: parsed.details || "",
          keywords: Array.isArray(parsed.keywords) && parsed.keywords.length ? parsed.keywords : [topic],
          quiz: quizIsValid ? { ...q, correctAnswer: Number(q.correctAnswer) } : {
            question: `${topic} 관련 기본 문제`,
            options: ["보기 1", "보기 2", "보기 3", "보기 4"],
            correctAnswer: 0,
            explanation: "데이터 정산 중 누락되어 대체된 퀴즈입니다."
          }
        };

        setNewsList(prev => [apiFormatted, ...prev]);
        setActiveTab('news');
        setAiPrompt("");
        setAiLoading(false);
        triggerToast("🎉 맞춤형 뉴스 브리핑과 전용 학습 퀴즈가 성공적으로 도착했습니다!");
        return;

        // 키 오류·잘못된 모델명 등은 재시도해도 소용없으므로 바로 중단
        if (err.status && [400, 401, 403, 404].includes(err.status)) break;
        if (attempt < MAX_RETRIES) {
          await sleep(delay);
          delay *= 2;
        }
      }
    }

    // 최종 실패 시: 체험 시뮬레이션 기사로 대체

                    <h3 className="text-base md:text-lg font-bold text-slate-100 leading-snug">
                      {currentQuiz.question}
                    </h3>
                  </div>

                  {/* 4지선다 보물 고르기 */}
                  <div className="grid grid-cols-1 gap-2.5">
                    {currentQuiz.options.map((option, idx) => (
                      <button
                        key={idx}
                        onClick={() => handleSubmitQuizAnswer(currentQuiz, idx)}
                        disabled={isAnswerSubmitted || isCurrentQuizAlreadyAnswered}
                        className={`w-full p-3.5 text-left rounded-xl border text-xs md:text-sm transition-all flex items-center justify-between ${getOptionClass(currentQuiz, idx)}`}
                      >
                        <span className="flex items-center gap-3">
                          <span className="w-5.5 h-5.5 flex items-center justify-center rounded-full bg-slate-900 text-[10px] font-black border border-slate-700 shrink-0">
                            {idx + 1}
                          </span>
                          <span>{option}</span>
                        </span>
                      </button>
                    ))}
                  </div>

                  {/* 전문가 설명 개방 구역 */}
                  {(isAnswerSubmitted || isCurrentQuizAlreadyAnswered) && (
                    <div className="bg-slate-950/60 p-4 rounded-xl border border-slate-850 space-y-1.5 animate-fadeIn">
                      <p className="text-xs font-black text-amber-500">💡 머니브루 해설 요약</p>
                      <p className="text-xs md:text-sm text-slate-300 leading-relaxed">
                        {currentQuiz.explanation}
                      </p>
                    </div>
                  )}

                  {/* 퀴즈 하단 컨트롤 조작바 */}
                  <div className="flex justify-between items-center border-t border-slate-700/50 pt-4">
                    <button
                      onClick={() => {
                        if (currentQuizIndex > 0) {
                          setCurrentQuizIndex(currentQuizIndex - 1);
                          setSelectedAnswer(null);
                          setIsAnswerSubmitted(false);
                        }
                      }}
                      disabled={currentQuizIndex === 0}
                      className="px-3.5 py-1.5 rounded-lg text-xs font-bold border border-slate-700 text-slate-400 disabled:opacity-30"
                    >
                      이전 문제
                    </button>
                    <button
                      onClick={handleNextQuiz}
                      className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-slate-950 text-xs font-black rounded-lg transition-all"
                    >
                      {currentQuizIndex < currentQuizList.length - 1 ? '다음 문제 도전' : '처음 퀴즈로 순환'}
                    </button>
                  </div>
                </div>

              </div>
            );
          })()}

          {/* ================= 탭 3: 내일의 시장 트렌드 예측 학습 ================= */}
          {activeTab === 'predict' && (
            <div className="space-y-6">
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-700 pb-4">
                <div>
                  <h2 className="text-xl md:text-2xl font-black text-slate-100 flex items-center gap-1.5">📈 시장 트렌드 예측 학습실</h2>
                  <p className="text-xs text-slate-400 mt-1">오늘 파악한 시사 트렌드를 바탕으로 내일 시장 지표의 방향성(상승/하락)을 분석해 보세요.</p>
                </div>
                <span className="text-xs bg-slate-800 px-3 py-1 rounded-full border border-slate-700 text-slate-300">
                  매일 밤 23:30 정산 마감
                </span>
              </div>

              {showVoteSuccess && (
                <div className="bg-emerald-950/70 border border-emerald-500 p-4 rounded-xl text-center text-xs text-emerald-300 animate-pulse">
                  🗳️ 시장 트렌드 예측 분석표가 제출되었습니다! 실제 지표 흐름과 일치 시 내일 원두 보상이 자동으로 제공됩니다.
                </div>
              )}

              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {marketPreds.map((item) => {
                  const hasVoted = userVotes[item.id] !== undefined;
                  const votedUp = userVotes[item.id] === 'up';
                  const votedDown = userVotes[item.id] === 'down';

                  return (
                    <div key={item.id} className="bg-slate-800/40 p-4.5 rounded-2xl border border-slate-700/60 flex flex-col justify-between space-y-4">
                      <div>
                        <div className="flex justify-between items-center text-[10px]">
                          <span className="text-slate-400">모의 학습 기준시세</span>
                          <span className={`font-black ${item.trend === 'up' ? 'text-emerald-400' : 'text-rose-400'}`}>
                            {item.change}
                          </span>
                        </div>
                        <h4 className="font-extrabold text-sm text-slate-200 mt-2">{item.name}</h4>
                        <p className="text-base font-black text-slate-100 mt-0.5">{item.price}</p>
                      </div>

                      <div className="space-y-1.5">
                        <div className="grid grid-cols-2 gap-2">
                          <button
                            onClick={() => handleMarketVote(item.id, 'up')}
                            disabled={hasVoted}
                            className={`py-2 rounded-lg text-xs font-bold transition-all ${
                              hasVoted
                                ? votedUp
                                  ? 'bg-emerald-600 text-slate-950'
                                  : 'bg-slate-800 text-slate-600'
                                : 'bg-slate-800 hover:bg-emerald-900/40 text-slate-300 border border-transparent'
                            }`}
                          >
                            ▲ 상승 예측
                          </button>
                          <button
                            onClick={() => handleMarketVote(item.id, 'down')}
                            disabled={hasVoted}
                            className={`py-2 rounded-lg text-xs font-bold transition-all ${
                              hasVoted
                                ? votedDown
                                  ? 'bg-rose-600 text-slate-950'
                                  : 'bg-slate-800 text-slate-600'
                                : 'bg-slate-800 hover:bg-rose-900/40 text-slate-300 border border-transparent'
                            }`}
                          >
                            ▼ 하락 예측
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              <div className="bg-slate-800/20 p-4.5 rounded-xl border border-slate-700/40 text-xs text-slate-400 leading-relaxed">
                <p className="font-extrabold text-slate-300 mb-1">💡 청소년 안심 트렌드 분석 가이드</p>
                <ul className="list-disc pl-4 space-y-0.5">
                  <li>이 지표 연구실은 학생 유저의 거시경제 지표 이해를 돕기 위한 <strong className="text-slate-300">비상업적 가상 교재</strong>입니다.</li>
                  <li>실제 금전 결제나 배팅성 요소는 완전히 차단되어 있으며, 예측 적중 시 앱 내부 학습 동기부여를 위한 원두 포인트 보상만 제공됩니다.</li>
                </ul>
              </div>
            </div>
          )}

          {/* ================= 탭 4: AI 관심 테마 추출기 ================= */}
          {activeTab === 'ai-custom' && (
            <div className="space-y-6">
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-700 pb-4">
                <div>
                  <h2 className="text-xl md:text-2xl font-black text-slate-100 flex items-center gap-1.5">
                    <IconSparkles className="w-6 h-6 text-amber-400" />
                    AI 관심 테마 추출기
                  </h2>
                  <p className="text-xs text-slate-400 mt-1">
                    학교에서 배운 경제 용어나 궁금한 신산업 트렌드를 직접 입력해보세요. AI가 유익한 학습 자료를 만들어 줍니다.
                  </p>
                </div>
              </div>

              <div className="bg-slate-800/50 p-5 rounded-2xl border border-slate-700/60 space-y-4">
                {/* 고정 검색 태그 */}
                <div className="flex flex-wrap gap-2">
                  {["전기차 배터리 시장", "클라우드 서비스 발전", "저출산과 경제", "ESG 경영 트렌드"].map(chip => (
                    <button
                      key={chip}
                      onClick={() => setAiPrompt(chip)}
                      className="text-xs bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-800 transition-colors"
                    >
                      {chip}
                    </button>
                  ))}
                </div>

                {/* 입력 폼 */}
                <div className="flex flex-col sm:flex-row gap-2">
                  <input
                    type="text"
                    value={aiPrompt}
                    onChange={(e) => setAiPrompt(e.target.value)}
                    placeholder="알고 싶은 경제 및 상식 키워드를 자유롭게 적어주세요..."
                    className="flex-1 bg-slate-950 text-slate-100 text-xs md:text-sm px-4 py-3 rounded-xl border border-slate-800 focus:outline-none focus:border-emerald-500"
                  />
                  <button
                    onClick={generateAICustomBrew}
                    disabled={aiLoading}
                    className="bg-gradient-to-r from-amber-600 to-emerald-600 text-slate-950 font-black text-xs px-6 py-3 rounded-xl flex items-center justify-center gap-1.5 disabled:opacity-50"
                  >
                    {aiLoading ? (
                      <span className="flex items-center gap-1">
                        <svg className="animate-spin h-3.5 w-3.5 text-slate-950" fill="none" viewBox="0 0 24 24">
                          <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
                          <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
                        </svg>
                        학습지 생성 중...
                      </span>
                    ) : "AI 추출 시작"}
                  </button>
                </div>

                {aiError && <p className="text-xs text-rose-400 bg-rose-950/30 p-2.5 rounded border border-rose-900/20">{aiError}</p>}
              </div>
            </div>
          )}

          {/* ================= 탭 5: 리워드 쿠폰 교환 상점 ================= */}
          {activeTab === 'shop' && (
            <div className="space-y-6">
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-700 pb-4">
                <div>
                  <h2 className="text-xl md:text-2xl font-black text-slate-100">🛍️ 학업 리워드 상점</h2>
                  <p className="text-xs text-slate-400 mt-1">열심히 퀴즈를 풀고 모은 소중한 원두 포인트로 도서 교환권 등 유익한 아이템을 획득하세요.</p>
                </div>
              </div>

              {/* 교환 모달 알림 */}
              {storeModalMsg && (
                <div className="bg-slate-900 border border-emerald-500/50 p-4 rounded-xl text-center space-y-2 text-xs">
                  <p className="font-bold text-emerald-400 whitespace-pre-line">{storeModalMsg}</p>
                  <button onClick={() => setStoreModalMsg("")} className="bg-slate-800 px-3 py-1.5 rounded font-black text-[10px] text-slate-300 hover:text-white">닫기</button>
                </div>
              )}

              {/* 상품 그리드 */}
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                {STORE_ITEMS.map((item) => {
                  const hasEnough = userBeans >= item.price;
                  return (
                    <div key={item.id} className="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50 flex flex-col justify-between space-y-3">
                      <div className="h-24 bg-slate-950 rounded-lg flex items-center justify-center text-3xl">
                        {item.image}
                      </div>
                      <div>
                        <h4 className="font-extrabold text-xs text-slate-200">{item.name}</h4>
                        <p className="text-[10px] text-slate-400 mt-1">{item.desc}</p>
                      </div>
                      <div className="flex items-center justify-between pt-2 border-t border-slate-700/30">
                        <span className="text-xs font-black text-amber-400">☕ {item.price} Beans</span>
                        <button
                          onClick={() => handleBuyItem(item)}
                          disabled={!hasEnough}
                          className={`px-3 py-1.5 rounded-lg text-[10px] font-black transition-all ${
                            hasEnough ? 'bg-amber-500 text-slate-950 hover:bg-amber-400' : 'bg-slate-800 text-slate-600 cursor-not-allowed'
                          }`}
                        >
                          교환하기
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* 쿠폰 내역 */}
              {purchaseHistory.length > 0 && (
                <div className="bg-slate-900/60 p-4 rounded-xl border border-slate-800 space-y-2 text-xs">
                  <p className="font-black text-slate-300">🎁 발급된 마이 보관함</p>
                  <div className="space-y-1.5 pt-1">
                    {purchaseHistory.map((item, idx) => (
                      <div key={idx} className="bg-slate-800 p-2.5 rounded border border-slate-700/40 flex justify-between items-center text-[11px]">
                        <span>{item.name}</span>
                        <strong className="font-mono text-emerald-400">{item.code}</strong>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}

        </main>
      </div>

      {/* --- 모바일 전용 하단 고정 네비게이션 바 --- */}
      <nav className="fixed bottom-0 left-0 right-0 z-40 md:hidden bg-slate-950/95 backdrop-blur-md border-t border-slate-800/80 flex justify-around items-center py-2.5 px-2">
        <button onClick={() => setActiveTab('news')} className={`flex flex-col items-center gap-1 ${activeTab === 'news' ? 'text-emerald-400' : 'text-slate-400'}`}>
          <IconNewspaper className="w-5 h-5" />
          <span className="text-[9px] font-bold">브리핑</span>
        </button>
        <button onClick={() => { setActiveTab('quiz'); setCurrentQuizIndex(0); }} className={`flex flex-col items-center gap-1 ${activeTab === 'quiz' ? 'text-emerald-400' : 'text-slate-400'}`}>
          <IconBrain className="w-5 h-5" />
          <span className="text-[9px] font-bold">퀴즈</span>
        </button>
        <button onClick={() => setActiveTab('predict')} className={`flex flex-col items-center gap-1 ${activeTab === 'predict' ? 'text-emerald-400' : 'text-slate-400'}`}>
          <IconTrendingUp className="w-5 h-5" />
          <span className="text-[9px] font-bold">트렌드</span>
        </button>
        <button onClick={() => setActiveTab('ai-custom')} className={`flex flex-col items-center gap-1 ${activeTab === 'ai-custom' ? 'text-amber-400' : 'text-slate-400'}`}>
          <IconSparkles className="w-5 h-5" />
          <span className="text-[9px] font-bold">AI추출</span>
        </button>
        <button onClick={() => setActiveTab('shop')} className={`flex flex-col items-center gap-1 ${activeTab === 'shop' ? 'text-emerald-400' : 'text-slate-400'}`}>
          <IconAward className="w-5 h-5" />
          <span className="text-[9px] font-bold">상점</span>
        </button>
      </nav>

      {/* --- 설정용 Gemini API 관리 모달 --- */}
      {showApiKeyModal && (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-700/80 max-w-md w-full p-6 rounded-2xl space-y-4 shadow-2xl relative animate-fadeIn">
            <button onClick={() => setShowApiKeyModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-100">✕</button>
            <h3 className="font-black text-slate-100 text-sm">Google Gemini API 설정</h3>
            <p className="text-xs text-slate-400 leading-relaxed">개인 구글 AI 스튜디오 API 키를 지정해두면, 정해진 기재 외에도 AI가 실시간 금융 데이터베이스를 추출해 무제한 숏폼 뉴스 및 퀴즈 카드를 만들어 줍니다.</p>
            <input
              type="password"
              value={apiKey}
              onChange={(e) => setApiKey(e.target.value)}
              placeholder="AI-zaSy... 형태의 키를 붙여넣으세요"
              className="w-full bg-slate-950 text-slate-100 text-xs p-2.5 rounded border border-slate-800 focus:outline-none focus:border-emerald-500"
            />
            <div className="flex gap-2">
              <button onClick={() => { setApiKey(""); setShowApiKeyModal(false); triggerToast("체험 세션 모드로 안전하게 리셋되었습니다."); }} className="flex-1 py-2 text-xs border border-slate-700 rounded text-slate-300">초기화</button>
              <button onClick={() => setShowApiKeyModal(false)} className="flex-1 py-2 text-xs bg-emerald-600 text-slate-950 font-bold rounded">저장</button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}
// --- 앱 마운트 ---
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <noscript>이 앱을 사용하려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
</body>
</html>
